# Reminders:
#   &name = reminder with this name from self
#   *name = any reminder with this name
#   %name = is a global (always available) reminder

# Global Variables:
#   players = all players in the game

# Non-Waking Abilities:
#   registers alignment, type = character can register as these, ie spy regestering as good
#   setup = affects setup

# Waking Abilities:
#   pick(n) = choose n players
#   object -> Feature = return that feature from the object
#   object add (&*%)name = adds a reminder

# Features:
#   Wake = is this player alive and do they wake tonight
#   Name = the player's name
#   Character = the player's character

washerwoman:
  image_url: "https://raw.githubusercontent.com/Nathan3-14/botc/refs/heads/main/icons/trouble_brewing/Icon_washerwoman.png"
  type: "townsfolk"
  reminders:
    - "townsfolk"
    - "wrong"
  ability_text: "You start knowing that 1 of 2 players is a particular Townsfolk."
  ability:
    - (players == &townsfolk) -> Name
    - (players == &wrong) -> Name
    - (players == &townsfolk) -> Character

librarian:
  image_url: "https://raw.githubusercontent.com/Nathan3-14/botc/refs/heads/main/icons/trouble_brewing/Icon_librarian.png"
  type: "townsfolk"
  reminders:
    - "outsider"
    - "wrong"
  ability_text: "You start knowing that 1 of 2 players is a particular Librarian."
  ability:
    - (players == &outsider) -> Name
    - (players == &wrong) -> Name
    - (players == &townsfolk) -> Character

investigator:
  image_url: "https://raw.githubusercontent.com/Nathan3-14/botc/refs/heads/main/icons/trouble_brewing/Icon_investigator.png"
  type: "townsfolk"
  reminders:
    - "minion"
    - "wrong"
  ability_text: "You start knowing that 1 of 2 players is a particular Minion."
  ability:
    - (players == &outsider) -> Name
    - (players == &wrong) -> Name
    - (players == &townsfolk) -> Character

# ... #

