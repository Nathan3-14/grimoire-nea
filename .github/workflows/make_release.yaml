name: "Make Release"

on:
  push:
    branches:
      - "main"
    tags:
    #temporarily 0., will be [1-9].
      - "0.*.*"

defaults:
  run:
    shell: bash
    working-directory: ./site_electron

jobs:
  upload:
    name: "Upload"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get bun
        uses: oven-sh/setup-bun@v2 
      
      - run: bun i
      - run: bun i -D vite-plugin-electron-renderer
      - run: bun run build

      - run: echo ${{ github.ref_name }}

      - name: Archive Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/${{ github.ref_name }}/grimoire-nea-Windows-${{ github.ref_name }}-Setup.exe
      
      - name: Archive Windows Unpacked
        uses: actions/upload-artifact@v4
        with:
          name: windows-unpacked
          path: |
            release/${{ github.ref_name }}/win-unpacked/*
