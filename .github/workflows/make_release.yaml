  create-pull-request:
    name: Create Pull Request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check for git repo
        run: |
          ls
          ll
          ls .git
      - name: Create Pull Request
        if: startswith(${{ github.ref_name }}, "v")
        uses: peter-evans/create-pull-request@v8
        with:
          branch: dev
          delete-branch: false
          base: main
          title: Merging of ${{ github.ref_name }} to main
