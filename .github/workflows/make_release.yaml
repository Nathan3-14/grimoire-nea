name: "Make Release"

on:
  push:
    branches:
      - "main"

defaults:
  run:
    shell: bash
    working-directory: ./site_electron

jobs:
  upload:
    name: "Upload"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get bun
        uses: oven-sh/setup-bun@v2 
      
      - run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "version=${VERSION#v}" > "$GITHUB_OUTPUT"
      - run: bun run build

      - name: Archive Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/${{steps.ver.outputs.version}}/grimoire-nea-Windows-{{steps.ver.outputs.version}}-Setup.exe
      
      - name: Archive Windows Unpacked
        uses: actions/upload-artifact@v4
        with:
          name: windows-unpacked
          path: |
            release/${{steps.ver.outputs.version}}/win-unpacked/*
